<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jared Luyster Theatre — a self-hosted video library streaming local video files, view only.">
    <title>Theatre — Jared Luyster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-theme.css?v=2">
    <style>
        /* Page-specific only. shared-theme.css supplies the zine palette, reset,
           topbar, nav, eyebrow chip and base typography. */

        .topbar-inner { height: 56px; }

        .brand {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        @media (max-width: 620px) {
            .nav { gap: 8px; }
            .nav a { font-size: 0.7rem; padding: 6px 10px; }
        }

        /* Stage */
        .stage { padding: 88px 0 72px; }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2.2rem, 6vw, 3.6rem);
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .lede {
            margin: 0 0 36px;
            max-width: 640px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Live indicator inside the shared eyebrow chip. */
        .eyebrow {
            gap: 10px;
            margin-bottom: 28px;
            font-family: "JetBrains Mono", monospace;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-ink);
        }

        /* Off air inverts the chip so the state reads without relying on the dot alone. */
        .eyebrow.off {
            background: var(--ink);
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 4px 4px 0 var(--danger);
        }

        .eyebrow.off .dot { background: var(--danger); }

        /* Player (hidden until a video is chosen) */
        .player {
            display: none;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--surface);
            border: var(--border-w) solid var(--paper);
            box-shadow: 6px 6px 0 var(--accent);
        }

        .player.show { display: block; }

        .player-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .now-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .close-btn {
            padding: 6px 12px;
            background: var(--ink);
            color: var(--paper);
            border: 2px solid var(--paper);
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 120ms, color 120ms;
        }

        .close-btn:hover { background: var(--paper); color: var(--ink); }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: var(--border-w) solid var(--paper);
            box-shadow: 5px 5px 0 var(--accent);
            cursor: pointer;
            transition: transform 120ms, box-shadow 120ms;
        }

        .card:hover {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--accent);
        }

        /* 16:9 is the video frame, not decoration — leave it alone. */
        .thumb-wrap { position: relative; aspect-ratio: 16 / 9; background: #000; }
        .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

        .play-badge {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            opacity: 0;
            transition: opacity 200ms;
            background: rgba(19, 17, 19, 0.45);
        }

        .card:hover .play-badge { opacity: 1; }

        .play-badge span {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            background: var(--accent);
            border: 2px solid var(--ink);
        }

        .play-badge span::after {
            content: "";
            width: 0;
            height: 0;
            margin-left: 4px;
            border-left: 16px solid var(--accent-ink);
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }

        .meta { padding: 14px 16px; }

        .title {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .sub { margin-top: 4px; color: var(--muted); font-size: 0.78rem; }

        .empty, .error {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            border: var(--border-w) dashed var(--muted);
        }

        .error { color: var(--danger); border-color: var(--danger); }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="shell topbar-inner">
            <a class="brand" href="index.html">Jared Luyster</a>
            <nav class="nav" id="main-nav">
                <a href="index.html">Home</a>
                <a href="radio.html">Radio</a>
                <a class="active" href="theatre.html">Theatre</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="stage">
            <div class="shell">
                <div class="eyebrow off" id="live-eyebrow"><span class="dot"></span><span id="live-text">Connecting…</span></div>
                <h1>Jared Luyster Theatre</h1>
                <p class="lede">A self-hosted video library streaming local files. Pick a title to watch — no accounts, no tracking.</p>

                <div class="player" id="player">
                    <div class="player-head">
                        <div class="now-title" id="now-title">Now playing</div>
                        <button class="close-btn" id="close-btn">Close ✕</button>
                    </div>
                    <video id="video" controls preload="metadata"></video>
                </div>

                <div class="grid" id="grid">
                    <div class="empty">Loading library…</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API = "https://theatre.jaredluyster.com/catalog.json";
        const gridEl = document.getElementById("grid");
        const playerEl = document.getElementById("player");
        const videoEl = document.getElementById("video");
        const nowTitleEl = document.getElementById("now-title");
        const liveEyebrowEl = document.getElementById("live-eyebrow");
        const liveTextEl = document.getElementById("live-text");

        function fmtDur(s) {
            if (!s) return "";
            const m = Math.floor(s / 60);
            const sec = Math.round(s % 60);
            return `${m}:${String(sec).padStart(2, "0")}`;
        }

        function setOnline(online, count) {
            if (online) {
                liveEyebrowEl.classList.remove("off");
                liveTextEl.textContent = count != null ? `${count} video${count === 1 ? "" : "s"} available` : "Online";
            } else {
                liveEyebrowEl.classList.add("off");
                liveTextEl.textContent = "Offline";
            }
        }

        function openVideo(v) {
            nowTitleEl.textContent = v.title || "Now playing";
            videoEl.src = v.url;
            playerEl.classList.add("show");
            playerEl.scrollIntoView({ behavior: "smooth", block: "start" });
            videoEl.play().catch(() => {});
        }

        document.getElementById("close-btn").addEventListener("click", () => {
            videoEl.pause();
            videoEl.removeAttribute("src");
            videoEl.load();
            playerEl.classList.remove("show");
        });

        function render(videos) {
            if (!videos.length) {
                gridEl.innerHTML = `<div class="empty">No videos in the library yet. Add files to the server's <code>videos/</code> folder.</div>`;
                return;
            }
            gridEl.innerHTML = videos.map((v) => `
                <article class="card" data-id="${encodeURIComponent(v.id)}">
                    <div class="thumb-wrap">
                        <img class="thumb" loading="lazy" alt="${v.title}" src="${v.thumbUrl}">
                        <div class="play-badge"><span></span></div>
                    </div>
                    <div class="meta">
                        <div class="title">${v.title}</div>
                        <div class="sub">${fmtDur(v.duration)}${v.width ? ` · ${v.width}×${v.height}` : ""}</div>
                    </div>
                </article>`).join("");

            gridEl.querySelectorAll(".card").forEach((card) => {
                card.addEventListener("click", () => {
                    const id = decodeURIComponent(card.dataset.id);
                    const v = videos.find((x) => x.id === id);
                    if (v) openVideo(v);
                });
            });
        }

        async function refresh() {
            try {
                const res = await fetch(API, { cache: "no-store" });
                if (!res.ok) throw new Error("status " + res.status);
                const data = await res.json();
                setOnline(true, data.videoCount);
                render(data.videos || []);
            } catch (err) {
                setOnline(false);
                gridEl.innerHTML = `<div class="error">Theatre is offline — the video server isn't reachable right now.</div>`;
            }
        }

        refresh();
        setInterval(refresh, 60000);
    </script>
</body>
</html>
