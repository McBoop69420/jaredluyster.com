<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live scoreboards and standings for the leagues I follow — MLB, MLS, Liga MX, Premier League, La Liga, Bundesliga, Serie A, Ligue 1, UCL, UEL, Eredivisie, Primeira Liga, Scottish Prem, Super Lig, NWSL, USL, NFL, NCAAF, NCAA men's and women's basketball.">
<title>Sports — Live</title>
<link rel="preconnect" href="https://site.api.espn.com">
<link rel="preconnect" href="https://statsapi.mlb.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/sports.css?v=51">
</head>
<body>
<article class="paper">
  <header class="masthead">
    <div class="toprule"></div>
    <h1><span class="accent-box">Sports</span></h1>
    <nav class="section-tabs" aria-label="Section">
      <a class="section-tab section-tab--active" href="/" aria-current="page">Games</a>
      <a class="section-tab" href="/betting/">Betting</a>
    </nav>
  </header>

  <nav class="filters" id="filters" aria-label="League filter"></nav>

  <div class="board-toolbar">
    <button class="refresh-btn" id="refreshBtn" type="button">↻ Refresh now</button>
  </div>

  <section class="spotlight" id="spotlight" aria-label="Live and important games">
    <header class="spotlight-head">
      <div>
        <div class="spotlight-kicker">Right now</div>
        <h2>Spotlight</h2>
      </div>
    </header>
    <div class="games-grid" id="spotlightGrid" aria-live="polite"></div>
  </section>

  <main id="board" class="board" aria-live="polite"></main>

  <footer class="colophon">
    <p>Live data from ESPN. Scores and standings refresh automatically; times shown in Eastern (ET).
      Looking for odds and the model? See <a href="/betting/">Betting</a>.</p>
  </footer>
</article>
<script src="/sports.js?v=65"></script>
</body>
</html>
