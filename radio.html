<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jared Luyster Radio — a self-hosted station streaming local music files, live.">
    <title>Radio — Jared Luyster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --muted: #71717a;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
        }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Topbar */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .nav {
            display: flex;
            gap: 22px;
        }

        .nav a {
            font-size: 0.82rem;
            color: var(--muted);
            transition: color 200ms;
        }

        .nav a:hover { color: var(--text); }
        .nav a.active { color: var(--accent); }

        @media (max-width: 620px) {
            .nav { gap: 14px; }
            .nav a { font-size: 0.72rem; }
        }

        /* Stage */
        .stage {
            padding: 88px 0 72px;
            position: relative;
            overflow: hidden;
        }

        .stage::before {
            content: "";
            position: absolute;
            top: -140px;
            left: 50%;
            transform: translateX(-50%);
            width: 640px;
            height: 420px;
            background: radial-gradient(ellipse, rgba(129, 140, 248, 0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--accent-dim);
            border: 1px solid rgba(129, 140, 248, 0.15);
            color: var(--accent);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            margin-bottom: 28px;
        }

        /* Equalizer */
        .eq {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }
        .eq span {
            width: 2.5px;
            height: 30%;
            background: var(--accent);
            border-radius: 2px;
            animation: eq 900ms ease-in-out infinite;
        }
        .eq span:nth-child(2) { animation-delay: 150ms; }
        .eq span:nth-child(3) { animation-delay: 300ms; }
        .eq span:nth-child(4) { animation-delay: 450ms; }
        .eq span:nth-child(5) { animation-delay: 600ms; }

        @keyframes eq {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }

        .eyebrow.off { color: #ef4444; background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.18); }
        .eyebrow.off .eq span { background: #ef4444; animation-play-state: paused; height: 30%; }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.05;
            position: relative;
        }

        /* Player card */
        .player {
            margin-top: 32px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            padding: 32px;
            position: relative;
            max-width: 640px;
            overflow: hidden;
        }

        .player::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 100% 0%, rgba(129, 140, 248, 0.08), transparent 55%);
            pointer-events: none;
        }

        .player-head {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
            position: relative;
        }

        .art {
            width: 96px;
            height: 96px;
            border-radius: 14px;
            object-fit: cover;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            box-shadow: 0 8px 28px rgba(129, 140, 248, 0.18);
            flex-shrink: 0;
        }

        .now-wrap {
            min-width: 0;
        }

        .now-track {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            min-height: 1.4em;
            line-height: 1.3;
            background: linear-gradient(92deg, #fff 0%, var(--accent) 140%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            transition: opacity 240ms;
        }

        .now-track.idle {
            background: none;
            -webkit-text-fill-color: var(--muted);
            color: var(--muted);
            font-weight: 500;
            font-size: 1.1rem;
        }

        audio {
            width: 100%;
            margin-top: 14px;
            filter: invert(0.92) hue-rotate(180deg);
            position: relative;
        }

    </style>
</head>
<body>
    <header class="topbar">
        <div class="shell topbar-inner">
            <a class="brand" href="index.html">Jared Luyster</a>
            <nav class="nav" id="main-nav">
                <a href="index.html">Home</a>
                <a class="active" href="radio.html">Radio</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="stage">
            <div class="shell">
                <div class="eyebrow off" id="live-eyebrow">
                    <span class="eq"><span></span><span></span><span></span><span></span><span></span></span>
                    <span id="live-text">Connecting…</span>
                </div>
                <h1 id="station-name">Jared Luyster Radio</h1>

                <div class="player">
                    <div class="player-head">
                        <img class="art" id="art" alt="" src="https://radio.jaredluyster.com/art/now">
                        <div class="now-wrap">
                            <div class="now-track idle" id="now-track">Loading current track…</div>
                        </div>
                    </div>
                    <audio id="player" controls preload="none" src="https://radio.jaredluyster.com/stream.mp3"></audio>
                </div>

            </div>
        </section>
    </main>

    <script>
        const API = "https://radio.jaredluyster.com/status.json";
        const ART = "https://radio.jaredluyster.com/art/now";
        const stationNameEl = document.getElementById("station-name");
        const nowTrackEl = document.getElementById("now-track");
        const artEl = document.getElementById("art");
        const liveEyebrowEl = document.getElementById("live-eyebrow");
        const liveTextEl = document.getElementById("live-text");

        let currentArtPath = null;

        function refreshArt(path) {
            if (path === currentArtPath) return;
            currentArtPath = path;
            artEl.src = `${ART}?t=${Date.now()}`;
        }

        function setOnline(online, stationName) {
            if (online) {
                liveEyebrowEl.classList.remove("off");
                liveTextEl.textContent = "On air";
                if (stationName) stationNameEl.textContent = stationName;
            } else {
                liveEyebrowEl.classList.add("off");
                liveTextEl.textContent = "Offline";
            }
        }

        async function refresh() {
            try {
                const res = await fetch(API, { cache: "no-store" });
                if (!res.ok) throw new Error("status " + res.status);
                const status = await res.json();

                setOnline(true, status.stationName);
                nowTrackEl.classList.remove("idle");
                nowTrackEl.textContent = status.nowPlaying?.display || "Unknown track";
                refreshArt(status.nowPlaying?.path);
            } catch (err) {
                setOnline(false);
                nowTrackEl.classList.add("idle");
                nowTrackEl.textContent = "Station is offline";
            }
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
