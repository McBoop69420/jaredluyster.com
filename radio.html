<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jared Luyster Radio — a self-hosted station streaming local music files, live.">
    <title>Radio — Jared Luyster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-theme.css?v=2">
    <style>
        /* Page-specific only. shared-theme.css supplies the zine palette, reset,
           topbar, nav, eyebrow chip and base typography. */

        .topbar-inner { height: 56px; }

        .brand {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        @media (max-width: 620px) {
            .nav { gap: 8px; }
            .nav a { font-size: 0.7rem; padding: 6px 10px; }
        }

        /* Stage */
        .stage { padding: 88px 0 72px; }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 6vw, 4rem);
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        /* On-air indicator. Sits inside the shared eyebrow chip; only the bars and the
           off state are local. */
        .eyebrow {
            gap: 10px;
            margin-bottom: 28px;
            font-family: "JetBrains Mono", monospace;
        }

        .eq {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .eq span {
            width: 3px;
            height: 30%;
            background: var(--accent-ink);
            animation: eq 900ms ease-in-out infinite;
        }

        .eq span:nth-child(2) { animation-delay: 150ms; }
        .eq span:nth-child(3) { animation-delay: 300ms; }
        .eq span:nth-child(4) { animation-delay: 450ms; }
        .eq span:nth-child(5) { animation-delay: 600ms; }

        @keyframes eq {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }

        /* Off air has to stay obvious without the animation carrying it: the chip
           inverts to dark with a red rule instead of the live orange. */
        .eyebrow.off {
            background: var(--ink);
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 4px 4px 0 var(--danger);
        }

        .eyebrow.off .eq span {
            background: var(--danger);
            animation-play-state: paused;
            height: 30%;
        }

        /* Player */
        .player {
            margin-top: 32px;
            max-width: 640px;
            padding: 32px;
            background: var(--surface);
            border: var(--border-w) solid var(--paper);
            box-shadow: 6px 6px 0 var(--accent);
        }

        .player-head {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
        }

        .art {
            width: 96px;
            height: 96px;
            flex-shrink: 0;
            object-fit: cover;
            background: var(--ink);
            border: var(--border-w) solid var(--paper);
        }

        .now-wrap { min-width: 0; }

        .now-track {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            min-height: 1.4em;
            line-height: 1.3;
            color: var(--accent);
            transition: opacity 240ms;
        }

        .now-track.idle {
            color: var(--muted);
            font-weight: 500;
            font-size: 1.1rem;
        }

        audio {
            width: 100%;
            margin-top: 14px;
            filter: invert(0.92) hue-rotate(180deg);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="shell topbar-inner">
            <a class="brand" href="index.html">Jared Luyster</a>
            <nav class="nav" id="main-nav">
                <a href="index.html">Home</a>
                <a class="active" href="radio.html">Radio</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="stage">
            <div class="shell">
                <div class="eyebrow off" id="live-eyebrow">
                    <span class="eq"><span></span><span></span><span></span><span></span><span></span></span>
                    <span id="live-text">Connecting…</span>
                </div>
                <h1 id="station-name">Jared Luyster Radio</h1>

                <div class="player">
                    <div class="player-head">
                        <img class="art" id="art" alt="" src="https://radio.jaredluyster.com/art/now">
                        <div class="now-wrap">
                            <div class="now-track idle" id="now-track">Loading current track…</div>
                        </div>
                    </div>
                    <audio id="player" controls preload="none" src="https://radio.jaredluyster.com/stream.mp3"></audio>
                </div>

            </div>
        </section>
    </main>

    <script>
        const API = "https://radio.jaredluyster.com/status.json";
        const ART = "https://radio.jaredluyster.com/art/now";
        const stationNameEl = document.getElementById("station-name");
        const nowTrackEl = document.getElementById("now-track");
        const artEl = document.getElementById("art");
        const liveEyebrowEl = document.getElementById("live-eyebrow");
        const liveTextEl = document.getElementById("live-text");

        let currentArtPath = null;

        function refreshArt(path) {
            if (path === currentArtPath) return;
            currentArtPath = path;
            artEl.src = `${ART}?t=${Date.now()}`;
        }

        function setOnline(online, stationName) {
            if (online) {
                liveEyebrowEl.classList.remove("off");
                liveTextEl.textContent = "On air";
                if (stationName) stationNameEl.textContent = stationName;
            } else {
                liveEyebrowEl.classList.add("off");
                liveTextEl.textContent = "Offline";
            }
        }

        async function refresh() {
            try {
                const res = await fetch(API, { cache: "no-store" });
                if (!res.ok) throw new Error("status " + res.status);
                const status = await res.json();

                setOnline(true, status.stationName);
                nowTrackEl.classList.remove("idle");
                nowTrackEl.textContent = status.nowPlaying?.display || "Unknown track";
                refreshArt(status.nowPlaying?.path);
            } catch (err) {
                setOnline(false);
                nowTrackEl.classList.add("idle");
                nowTrackEl.textContent = "Station is offline";
            }
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
