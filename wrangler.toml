# Cloudflare Pages configuration for jaredluyster.com
#
# The site is static (no build step) — Pages serves the repo root directly, and
# the Function in functions/marketplace/[[path]].ts proxies /marketplace/* to the
# marketplace backend.
#
# Deploy:  wrangler pages deploy .
# Dev:     wrangler pages dev .

name = "jaredluyster-com"
compatibility_date = "2026-07-01"
pages_build_output_dir = "."

[vars]
# Origin of the marketplace backend. Confirm the exact URL in your Render
# dashboard — the service is named "jaredluyster-com" so this is the likely value.
# In production, set/override this in the Pages project's environment variables.
MARKETPLACE_ORIGIN = "https://jaredluyster-com.onrender.com"

# Roto's multiplayer rooms. The class is defined in the separate roto-draft-room Worker
# (Pages cannot declare a Durable Object itself), so script_name is required here — it is
# optional only for Worker-to-Worker bindings. Deploy that Worker first, and add the same
# binding under the Pages project's Settings → Bindings for production.
[[durable_objects.bindings]]
name = "DRAFT_ROOM"
class_name = "DraftRoom"
script_name = "roto-draft-room"

# social.jaredluyster.com's asset library. The bucket itself is created once via
# `wrangler r2 bucket create jaredluyster-social-assets` (or the dashboard) — this binding
# covers `wrangler pages dev`/`deploy`; the dashboard-managed production project also needs
# the same binding added under Settings -> Bindings -> R2 Bucket (variable name
# SOCIAL_ASSETS), same one-time step as the DRAFT_ROOM binding above.
[[r2_buckets]]
binding = "SOCIAL_ASSETS"
bucket_name = "jaredluyster-social-assets"

# RedZone's PRIVATE bet store (functions/redzone/api/[[path]].ts). Picks live in this bucket, not
# in the repo — the repo is public. Until the block below is uncommented the endpoint answers
# 503 "not-configured" (fails closed), so shipping without it is safe.
#
# ORDER MATTERS: create the bucket BEFORE uncommenting and pushing. Pages fails the deploy of the
# WHOLE site if a bound R2 bucket doesn't exist, not just this feature.
#   1. wrangler r2 bucket create jaredluyster-redzone-bets
#   2. wrangler pages secret put BETS_ALLOWED_EMAILS --project-name jaredluyster-com
#        (the owner's email; comma-separate several. A SECRET — never put it in [vars] above.
#         A guest on the redzone Access policy is let through to the hostname but is refused here.)
#   3. optional hardening: wrangler pages secret put ACCESS_AUD ... (the redzone Access app's AUD tag)
#   4. uncomment, then push:
# [[r2_buckets]]
# binding = "REDZONE_BETS"
# bucket_name = "jaredluyster-redzone-bets"
