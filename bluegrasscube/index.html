<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bluegrass Cube — staging area for cube options and group content.">
    <title>Bluegrass Cube — Staging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --muted: #71717a;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
        }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            height: 56px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .badge {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 999px;
            padding: 4px 10px;
        }

        .hero {
            padding: 64px 0 32px;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
        }

        .hero p {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
            max-width: 620px;
            margin: 0;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .card p {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }

        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .footer a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span class="brand">Bluegrass Cube</span>
            <span class="badge">Staging</span>
        </div>
    </div>

    <main class="shell">
        <section class="hero">
            <h1>Bluegrass Cube — Staging Area</h1>
            <p>
                Working space for cube options, list changes, and other group content
                before it goes live. The public site is still
                <a href="https://bluegrasscube.com" style="color: var(--accent);">bluegrasscube.com</a>.
            </p>
        </section>

        <div class="card">
            <h2>Cube Options</h2>
            <p>Content coming soon.</p>
        </div>

        <div class="footer">
            bluegrasscube.jaredluyster.com — internal staging, not the live site
        </div>
    </main>
</body>
</html>
