<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bluegrass Cube — staging area for cube options and group content.">
    <title>Bluegrass Cube — Staging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --muted: #71717a;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
        }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            height: 56px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .discord-invite {
            margin-top: 32px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: radial-gradient(circle at 15% 30%, rgba(88, 101, 242, 0.35), transparent 55%),
                        radial-gradient(circle at 85% 15%, rgba(88, 101, 242, 0.25), transparent 50%),
                        linear-gradient(160deg, #1a1a2e 0%, #14141f 100%);
            border: 1px solid rgba(88, 101, 242, 0.25);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .discord-invite .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--surface);
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .discord-invite .info {
            flex: 1;
            min-width: 180px;
        }

        .discord-invite .info .label {
            font-size: 0.72rem;
            color: var(--muted);
            margin: 0 0 2px;
        }

        .discord-invite .info h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 4px;
            color: var(--text);
        }

        .discord-invite .counts {
            display: flex;
            gap: 14px;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .discord-invite .counts span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.online { background: #23a55a; }
        .dot.total { background: var(--muted); }

        .discord-invite .join-btn {
            background: #5865f2;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background 0.15s ease;
        }

        .discord-invite .join-btn:hover {
            background: #4752c4;
            text-decoration: none;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 40px 0 12px;
        }

        #cube-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cube-card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 22px;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .cube-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .cube-card .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .cube-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
            color: var(--text);
        }

        .cube-card .arrow {
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .cube-card:hover .arrow {
            transform: translateX(3px);
        }

        .cube-card .primer {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.6;
            margin: 10px 0 0;
        }

        .cube-card .strategy {
            color: var(--text);
            font-size: 0.82rem;
            line-height: 1.6;
            margin: 10px 0 0;
        }

        .cube-card .strategy .label {
            color: var(--accent);
            font-weight: 600;
            margin-right: 4px;
        }

        .cube-card .meta {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--accent);
        }

        .cube-card .meta span {
            background: var(--accent-dim);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 999px;
            padding: 3px 10px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span class="brand">Bluegrass Cube</span>
        </div>
    </div>

    <main class="shell">
        <a class="discord-invite" id="discord-invite" href="https://discord.com/invite/dFCXg6QdJW" target="_blank" rel="noopener" style="text-decoration: none;">
            <img class="icon" id="discord-icon" src="" alt="" hidden>
            <div class="info">
                <p class="label" id="discord-label">Join us on Discord</p>
                <h2 id="discord-name">Bluegrass Cube</h2>
                <div class="counts" id="discord-counts"></div>
            </div>
            <span class="join-btn">Join Server</span>
        </a>

        <p class="section-title">Cube Options</p>

        <div id="cube-list"></div>
    </main>

    <script>
        (async () => {
            try {
                const res = await fetch('https://discord.com/api/v9/invites/dFCXg6QdJW?with_counts=true');
                if (!res.ok) throw new Error('invite fetch failed');
                const data = await res.json();
                const guild = data.guild || {};
                const profile = data.profile || {};

                document.getElementById('discord-name').textContent = guild.name || 'Bluegrass Cube';

                if (guild.icon) {
                    const iconEl = document.getElementById('discord-icon');
                    iconEl.src = `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.webp?size=128`;
                    iconEl.hidden = false;
                }

                const online = data.approximate_presence_count ?? profile.online_count;
                const members = data.approximate_member_count ?? profile.member_count;
                document.getElementById('discord-counts').innerHTML = `
                    <span><span class="dot online"></span>${online} Online</span>
                    <span><span class="dot total"></span>${members} Members</span>
                `;
            } catch (err) {
                // Static fallback (already in the markup) stays as-is if the API is unreachable.
            }
        })();

        // Add a CubeCobra ID (full UUID or short ID) here for each cube option.
        const CUBE_IDS = [
            'BluegrassCube',
            'ff7caa01-4bc4-451c-b659-dc3424468938',
            '9hd',
            '91af0e8e-033e-4911-acce-2663ca4f50c4',
            'fc1f6adf-ea38-46d9-b04e-fd8e1a2361c2',
            '2d231bc9-1b10-4817-a889-9d86f17dacb9',
            'dd8fd6de-353e-43a1-9a2f-e6f764808f72',
            'ruo',
            '9j0',
        ];

        // Override the display name for specific cubes (e.g. a nickname the group uses).
        const NAME_OVERRIDES = {
            '9hd': 'Bangers Only Cube (Legacy+)',
            'fc1f6adf-ea38-46d9-b04e-fd8e1a2361c2': 'Live the Dream Cube',
            'ff7caa01-4bc4-451c-b659-dc3424468938': 'Commander Cube',
        };

        // Curated drafting-strategy notes, pulled from each cube's CubeCobra description
        // where it names color pairs / archetypes (not auto-generated — hand-checked per cube).
        const STRATEGY_NOTES = {
            'BluegrassCube': 'Leans into combo and synergy over classic Vintage archetypes (e.g. Doomsday), and is currently featuring the Initiative mechanic from Commander Legends: Battle for Baldur’s Gate.',
            '9hd': 'Cross-synergies center on ETBs, +1/+1 counters, and cheating creatures into play.',
            '91af0e8e-033e-4911-acce-2663ca4f50c4': 'WR Aggro/Heroic · GB Graveyard · WB Drain/Reanimator · WU Heroic/Flyers · UB Mill/Control · RB Burn/Minotaurs · RG Stompy/Satyrs · WG +1/+1 Counters/Centaurs · UR Burn/Spells Matter',
            'fc1f6adf-ea38-46d9-b04e-fd8e1a2361c2': 'Emulates Commander’s splashy, high-variance gameplay in a normal Cube format — expect big mana ramp and swingy bombs.',
            '2d231bc9-1b10-4817-a889-9d86f17dacb9': 'WU Blink/Tempo · UB Control/Reanimator · BR Sacrifice/Aggro · RG Ramp/Stompy · GW Auras/Voltron · WB Aristocrats · UR Spells Matter · BG Graveyard/Midrange · RW Aggro/Tokens · GU Ramp/Elves',
            'dd8fd6de-353e-43a1-9a2f-e6f764808f72': 'Artifact-centric, with blink, sacrifice, and modified-creature subthemes. Most decks land on two colors, though mono and three-color builds are viable.',
            'ruo': 'WU Flicker · UB Reanimator · BR Sacrifice · RG Power · GW Enchantments · WB Revolt · BG +1/+1 Counters · GU Ramp · UR Prowess · RW Go-wide/Tokens',
        };

        // Compute a factual card-composition summary from the actual mainboard,
        // instead of relying on the (often logistics-focused) CubeCobra description.
        function summarizeCube(data) {
            const mainboard = data.cards?.mainboard || [];
            if (mainboard.length === 0) return '';

            let creatures = 0, lands = 0, spells = 0;
            const colorCounts = { W: 0, U: 0, B: 0, R: 0, G: 0 };

            for (const entry of mainboard) {
                const details = entry.details || {};
                const type = details.type || '';
                if (/Land/.test(type)) lands++;
                else if (/Creature/.test(type)) creatures++;
                else spells++;

                const identity = details.color_identity || [];
                if (identity.length === 1) colorCounts[identity[0]] = (colorCounts[identity[0]] || 0) + 1;
            }

            const nonland = mainboard.length - lands;
            const creaturePct = nonland > 0 ? Math.round((creatures / nonland) * 100) : 0;
            const spellPct = nonland > 0 ? Math.round((spells / nonland) * 100) : 0;
            const colorsPresent = Object.values(colorCounts).filter(n => n > 0).length;

            const parts = [`${creaturePct}% creatures`, `${spellPct}% spells`];
            if (lands > 0) parts.push(`${lands} nonbasic lands`);

            const colorNote = colorsPresent === 5
                ? 'spanning all five colors'
                : colorsPresent > 0
                    ? `spanning ${colorsPresent} color${colorsPresent > 1 ? 's' : ''}`
                    : '';

            return `${mainboard.length} cards — ${parts.join(', ')}${colorNote ? ', ' + colorNote : ''}.`;
        }

        const listEl = document.getElementById('cube-list');
        const PINNED_ID = 'BluegrassCube';

        function displayName(cubeId, data) {
            return NAME_OVERRIDES[cubeId] || (data?.name || 'Untitled Cube').trim();
        }

        function renderCube(cubeId, data) {
            const card = document.createElement('a');
            card.className = 'cube-card';
            card.href = `https://cubecobra.com/cube/list/${cubeId}`;
            card.target = '_blank';
            card.rel = 'noopener';

            const row = document.createElement('div');
            row.className = 'row';
            const nameEl = document.createElement('h3');
            nameEl.className = 'cube-name';
            const arrowEl = document.createElement('span');
            arrowEl.className = 'arrow';
            arrowEl.textContent = '→';
            row.append(nameEl, arrowEl);

            const primerEl = document.createElement('p');
            primerEl.className = 'primer';

            card.append(row, primerEl);

            if (data) {
                nameEl.textContent = displayName(cubeId, data);
                primerEl.textContent = summarizeCube(data) || 'No card data available.';

                const strategyNote = STRATEGY_NOTES[cubeId];
                if (strategyNote) {
                    const strategyEl = document.createElement('p');
                    strategyEl.className = 'strategy';
                    const labelEl = document.createElement('span');
                    labelEl.className = 'label';
                    labelEl.textContent = 'Archetypes:';
                    strategyEl.append(labelEl, document.createTextNode(strategyNote));
                    card.appendChild(strategyEl);
                }

                const cardCount = data.cards?.mainboard?.length ?? data.cardCount;
                const metaEl = document.createElement('div');
                metaEl.className = 'meta';
                const countSpan = document.createElement('span');
                countSpan.textContent = `${cardCount} cards`;
                metaEl.appendChild(countSpan);
                card.appendChild(metaEl);
            } else {
                nameEl.textContent = 'Cube unavailable';
                primerEl.textContent = "Couldn't load live description — view on CubeCobra for details.";
            }
            listEl.appendChild(card);
        }

        Promise.all(
            CUBE_IDS.map(cubeId =>
                fetch(`https://cubecobra.com/cube/api/cubejson/${cubeId}`)
                    .then(res => res.ok ? res.json() : null)
                    .catch(() => null)
                    .then(data => ({ cubeId, data }))
            )
        ).then(results => {
            results.sort((a, b) => {
                if (a.cubeId === PINNED_ID) return -1;
                if (b.cubeId === PINNED_ID) return 1;
                const nameA = displayName(a.cubeId, a.data).toLowerCase();
                const nameB = displayName(b.cubeId, b.data).toLowerCase();
                return nameA.localeCompare(nameB);
            });
            results.forEach(({ cubeId, data }) => renderCube(cubeId, data));
        });
    </script>
</body>
</html>
