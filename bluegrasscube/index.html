<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bluegrass Cube — staging area for cube options and group content.">
    <title>Bluegrass Cube — Staging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --muted: #71717a;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
        }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            height: 56px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .badge {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 999px;
            padding: 4px 10px;
        }

        .discord-invite {
            margin-top: 32px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: radial-gradient(circle at 15% 30%, rgba(88, 101, 242, 0.35), transparent 55%),
                        radial-gradient(circle at 85% 15%, rgba(88, 101, 242, 0.25), transparent 50%),
                        linear-gradient(160deg, #1a1a2e 0%, #14141f 100%);
            border: 1px solid rgba(88, 101, 242, 0.25);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .discord-invite .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--surface);
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .discord-invite .info {
            flex: 1;
            min-width: 180px;
        }

        .discord-invite .info .label {
            font-size: 0.72rem;
            color: var(--muted);
            margin: 0 0 2px;
        }

        .discord-invite .info h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 4px;
            color: var(--text);
        }

        .discord-invite .counts {
            display: flex;
            gap: 14px;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .discord-invite .counts span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.online { background: #23a55a; }
        .dot.total { background: var(--muted); }

        .discord-invite .join-btn {
            background: #5865f2;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background 0.15s ease;
        }

        .discord-invite .join-btn:hover {
            background: #4752c4;
            text-decoration: none;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .card p {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span class="brand">Bluegrass Cube</span>
            <span class="badge">Staging</span>
        </div>
    </div>

    <main class="shell">
        <a class="discord-invite" id="discord-invite" href="https://discord.com/invite/dFCXg6QdJW" target="_blank" rel="noopener" style="text-decoration: none;">
            <img class="icon" id="discord-icon" src="" alt="" hidden>
            <div class="info">
                <p class="label" id="discord-label">Join us on Discord</p>
                <h2 id="discord-name">Bluegrass Cube</h2>
                <div class="counts" id="discord-counts"></div>
            </div>
            <span class="join-btn">Join Server</span>
        </a>

        <div class="card">
            <h2>Cube Options</h2>
            <p>
                <a href="./cube.html?id=ff7caa01-4bc4-451c-b659-dc3424468938">Hyrulesavior's Commander Cube</a>
                — 1000-card Commander cube. List stays in sync automatically, pulled live from CubeCobra.
            </p>
        </div>
    </main>

    <script>
        (async () => {
            try {
                const res = await fetch('https://discord.com/api/v9/invites/dFCXg6QdJW?with_counts=true');
                if (!res.ok) throw new Error('invite fetch failed');
                const data = await res.json();
                const guild = data.guild || {};
                const profile = data.profile || {};

                document.getElementById('discord-name').textContent = guild.name || 'Bluegrass Cube';

                if (guild.icon) {
                    const iconEl = document.getElementById('discord-icon');
                    iconEl.src = `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.webp?size=128`;
                    iconEl.hidden = false;
                }

                const online = data.approximate_presence_count ?? profile.online_count;
                const members = data.approximate_member_count ?? profile.member_count;
                document.getElementById('discord-counts').innerHTML = `
                    <span><span class="dot online"></span>${online} Online</span>
                    <span><span class="dot total"></span>${members} Members</span>
                `;
            } catch (err) {
                // Static fallback (already in the markup) stays as-is if the API is unreachable.
            }
        })();
    </script>
</body>
</html>
