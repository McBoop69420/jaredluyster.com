<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bluegrass Cube — staging area for cube options and group content.">
    <title>Bluegrass Cube — Staging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: #131316;
            --surface-hover: #1a1a1f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f0f0f0;
            --muted: #71717a;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
        }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            height: 56px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .discord-invite {
            margin-top: 32px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: radial-gradient(circle at 15% 30%, rgba(88, 101, 242, 0.35), transparent 55%),
                        radial-gradient(circle at 85% 15%, rgba(88, 101, 242, 0.25), transparent 50%),
                        linear-gradient(160deg, #1a1a2e 0%, #14141f 100%);
            border: 1px solid rgba(88, 101, 242, 0.25);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .discord-invite .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--surface);
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .discord-invite .info {
            flex: 1;
            min-width: 180px;
        }

        .discord-invite .info .label {
            font-size: 0.72rem;
            color: var(--muted);
            margin: 0 0 2px;
        }

        .discord-invite .info h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 4px;
            color: var(--text);
        }

        .discord-invite .counts {
            display: flex;
            gap: 14px;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .discord-invite .counts span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.online { background: #23a55a; }
        .dot.total { background: var(--muted); }

        .discord-invite .join-btn {
            background: #5865f2;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background 0.15s ease;
        }

        .discord-invite .join-btn:hover {
            background: #4752c4;
            text-decoration: none;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 40px 0 12px;
        }

        #cube-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cube-card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 22px;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .cube-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .cube-card .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .cube-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
            color: var(--text);
        }

        .cube-card .arrow {
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .cube-card:hover .arrow {
            transform: translateX(3px);
        }

        .cube-card .primer {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.6;
            margin: 10px 0 0;
        }

        .cube-card .meta {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--accent);
        }

        .cube-card .meta span {
            background: var(--accent-dim);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 999px;
            padding: 3px 10px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span class="brand">Bluegrass Cube</span>
        </div>
    </div>

    <main class="shell">
        <a class="discord-invite" id="discord-invite" href="https://discord.com/invite/dFCXg6QdJW" target="_blank" rel="noopener" style="text-decoration: none;">
            <img class="icon" id="discord-icon" src="" alt="" hidden>
            <div class="info">
                <p class="label" id="discord-label">Join us on Discord</p>
                <h2 id="discord-name">Bluegrass Cube</h2>
                <div class="counts" id="discord-counts"></div>
            </div>
            <span class="join-btn">Join Server</span>
        </a>

        <p class="section-title">Cube Options</p>

        <div id="cube-list"></div>
    </main>

    <script>
        (async () => {
            try {
                const res = await fetch('https://discord.com/api/v9/invites/dFCXg6QdJW?with_counts=true');
                if (!res.ok) throw new Error('invite fetch failed');
                const data = await res.json();
                const guild = data.guild || {};
                const profile = data.profile || {};

                document.getElementById('discord-name').textContent = guild.name || 'Bluegrass Cube';

                if (guild.icon) {
                    const iconEl = document.getElementById('discord-icon');
                    iconEl.src = `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.webp?size=128`;
                    iconEl.hidden = false;
                }

                const online = data.approximate_presence_count ?? profile.online_count;
                const members = data.approximate_member_count ?? profile.member_count;
                document.getElementById('discord-counts').innerHTML = `
                    <span><span class="dot online"></span>${online} Online</span>
                    <span><span class="dot total"></span>${members} Members</span>
                `;
            } catch (err) {
                // Static fallback (already in the markup) stays as-is if the API is unreachable.
            }
        })();

        // Add a CubeCobra ID (full UUID or short ID) here for each cube option.
        const CUBE_IDS = [
            'BluegrassCube',
            'ff7caa01-4bc4-451c-b659-dc3424468938',
            '9hd',
            '91af0e8e-033e-4911-acce-2663ca4f50c4',
            'fc1f6adf-ea38-46d9-b04e-fd8e1a2361c2',
            '2d231bc9-1b10-4817-a889-9d86f17dacb9',
            'dd8fd6de-353e-43a1-9a2f-e6f764808f72',
            'ruo',
            '9j0',
        ];

        // CubeCobra descriptions use Markdown (headers, blockquotes, images, [[card]] links).
        // Pull the first line that reads as actual prose, stripped of markup, for the card primer.
        function extractPrimer(description) {
            const lines = (description || '').split('\n');
            for (let line of lines) {
                let cleaned = line
                    .replace(/!\[[^\]]*\]\[[^\]]*\]/g, '')   // ![alt][ref] images
                    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')    // ![alt](url) images
                    .replace(/\[\[([^\]]+)\]\]/g, '$1')      // [[Card Name]] -> Card Name
                    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1') // [text](url) -> text
                    .replace(/^[#>*<\s]+|[#>*<\s]+$/g, '')   // strip leading/trailing markup chars
                    .replace(/\*\*/g, '')                    // bold markers
                    .trim();
                if (cleaned.length > 40 && /[a-zA-Z]{3,}/.test(cleaned)) {
                    return cleaned.length > 220 ? cleaned.slice(0, 217) + '…' : cleaned;
                }
            }
            return '';
        }

        const listEl = document.getElementById('cube-list');
        const PINNED_ID = 'BluegrassCube';

        function renderCube(cubeId, data) {
            const card = document.createElement('a');
            card.className = 'cube-card';
            card.href = `./cube.html?id=${cubeId}`;

            const row = document.createElement('div');
            row.className = 'row';
            const nameEl = document.createElement('h3');
            nameEl.className = 'cube-name';
            const arrowEl = document.createElement('span');
            arrowEl.className = 'arrow';
            arrowEl.textContent = '→';
            row.append(nameEl, arrowEl);

            const primerEl = document.createElement('p');
            primerEl.className = 'primer';

            card.append(row, primerEl);

            if (data) {
                nameEl.textContent = (data.name || 'Untitled Cube').trim();
                primerEl.textContent = extractPrimer(data.description) || 'No description provided.';

                const cardCount = data.cards?.mainboard?.length ?? data.cardCount;
                const metaEl = document.createElement('div');
                metaEl.className = 'meta';
                const countSpan = document.createElement('span');
                countSpan.textContent = `${cardCount} cards`;
                metaEl.appendChild(countSpan);
                card.appendChild(metaEl);
            } else {
                nameEl.textContent = 'Cube unavailable';
                primerEl.textContent = "Couldn't load live description — view on CubeCobra for details.";
            }
            listEl.appendChild(card);
        }

        Promise.all(
            CUBE_IDS.map(cubeId =>
                fetch(`https://cubecobra.com/cube/api/cubejson/${cubeId}`)
                    .then(res => res.ok ? res.json() : null)
                    .catch(() => null)
                    .then(data => ({ cubeId, data }))
            )
        ).then(results => {
            results.sort((a, b) => {
                if (a.cubeId === PINNED_ID) return -1;
                if (b.cubeId === PINNED_ID) return 1;
                const nameA = (a.data?.name || a.cubeId).trim().toLowerCase();
                const nameB = (b.data?.name || b.cubeId).trim().toLowerCase();
                return nameA.localeCompare(nameB);
            });
            results.forEach(({ cubeId, data }) => renderCube(cubeId, data));
        });
    </script>
</body>
</html>
