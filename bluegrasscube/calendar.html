<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bluegrass Cube — calendar of Cube Nights and special events in Lexington, KY.">
    <title>Calendar — Bluegrass Cube</title>
    <link rel="preload" href="fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/space-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="board.css?v=12">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">Bluegrass Cube</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
            <a href="index.html#upcoming-events">Upcoming Events</a>
            <a href="calendar.html" aria-current="page">Calendar</a>
            <a href="https://discord.com/invite/dFCXg6QdJW" target="_blank" rel="noopener noreferrer">Discord</a>
        </nav>
    </header>

    <main class="board">
        <section class="upcoming-section">
            <p class="section-label">Calendar</p>
            <div class="calendar-sheet">
                <div class="calendar-header">
                    <button type="button" class="calendar-nav-btn" id="calendar-prev" aria-label="Previous month">&larr;</button>
                    <h2 class="calendar-title" id="calendar-title"></h2>
                    <button type="button" class="calendar-nav-btn" id="calendar-next" aria-label="Next month">&rarr;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid"></div>
            </div>
        </section>
    </main>

    <script src="events.js?v=2" defer></script>
    <script src="calendar.js?v=3" defer></script>
</body>
</html>
