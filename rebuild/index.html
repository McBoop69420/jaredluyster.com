<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Rebuild | Jared Luyster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23131113'/%3E%3Cpath fill='%23f2971d' d='M1 6h6v1H1zM2 3h4v2H2zM3 1h2v2H3z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/shared-theme.css" />
<style>
  :root { --midterm: #8bbfe8; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  main { max-width: 1680px; margin: 0 auto; padding: 32px clamp(16px, 3vw, 48px) 64px; }
  .kicker { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
  h2 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 1rem; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .ycol { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .sem { border: 2px solid var(--muted); padding: 10px 12px; color: var(--muted); }
  .sem b { display: block; font-family: var(--font-display); color: var(--text); }
  .sem.done { border-color: var(--paper); color: var(--paper); opacity: .6; }
  .sem.now { border-color: var(--accent); background: var(--surface); color: var(--text); box-shadow: var(--shadow-soft); }
  .sem .tag { float: right; margin-left: 8px; padding: 1px 6px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
  .sem small { display: block; margin-top: 2px; }
  .yr { margin: 0; font-family: var(--font-display); color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

  section + section { margin-top: 40px; }
  .cal-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { font: inherit; font-family: var(--font-display); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; padding: 5px 10px; background: none; color: var(--muted); border: 2px solid var(--muted); cursor: pointer; }
  .tabs button:hover { color: var(--text); border-color: var(--paper); }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .range { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
  .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px 28px; }
  @media (max-width: 1400px) { .months { grid-template-columns: repeat(4, 1fr); gap: 20px 18px; } }
  @media (max-width: 900px) { .months { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px) { .months { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 440px) { .months { grid-template-columns: 1fr; } }
  .month h3 { font-family: var(--font-display); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
  .month h3 span { color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: .78rem; text-align: center; }
  .days .dow { color: var(--muted); font-size: .65rem; padding-bottom: 2px; }
  .days .d { padding: 4px 0; color: var(--muted); border: 1px solid transparent; }
  .days .d.term { background: var(--surface); color: var(--text); }
  .days .d.brk { background: none; color: var(--accent); border-color: var(--accent); }
  .days .d.mid { background: var(--midterm); color: var(--ink); border-color: var(--midterm); font-weight: 700; }
  .days .d.read { color: var(--danger); border-color: var(--danger); border-style: dashed; }
  .days .d.fin { background: var(--danger); color: var(--ink); border-color: var(--danger); font-weight: 700; }
  .days .d.grad { background: var(--paper); color: var(--ink); font-weight: 700; }
  .days .d.today { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .days .d.past { opacity: .45; }
  @media (min-width: 1401px) { .days { font-size: .9rem; } .days .dow { font-size: .72rem; } .month h3 { font-size: .95rem; } }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; color: var(--muted); font-size: .8rem; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1px solid transparent; }
  .legend .term { background: var(--surface); border-color: var(--muted); }
  .legend .brk { border-color: var(--accent); }
  .legend .mid { background: var(--midterm); }
  .legend .read { border-color: var(--danger); border-style: dashed; }
  .legend .fin { background: var(--danger); }
  .sem small.mid { color: var(--midterm); font-weight: 600; }
  .sem.done small.mid { color: inherit; font-weight: inherit; }
  .legend .grad { background: var(--paper); }
  .sem small.fin { color: var(--danger); font-weight: 600; }
  .sem.done small.fin { color: inherit; font-weight: inherit; }
  .legend .today { background: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="kicker">Rebuild</p>
  <h1 id="year">…</h1>
  <p class="sub" id="where"></p>

  <section aria-label="Year calendar">
    <div class="cal-head">
      <h2>Calendar</h2>
      <div class="tabs" id="tabs" role="group" aria-label="College year"></div>
    </div>
    <p class="range" id="range"></p>
    <div class="months" id="months"></div>
    <div class="legend">
      <span><i class="term"></i>Semester</span>
      <span><i class="brk"></i>Break or holiday</span>
      <span><i class="mid"></i>Midterms week</span>
      <span><i class="read"></i>Reading days</span>
      <span><i class="fin"></i>Finals week</span>
      <span><i class="grad"></i>Graduation</span>
      <span><i class="today"></i>Today</span>
    </div>
  </section>

  <section aria-label="Timeline">
    <h2>Timeline</h2>
    <div class="grid" id="timeline"></div>
  </section>
</main>

<script>
// University of Kentucky academic calendar, from the registrar:
//   registrar.uky.edu/calendars/five-year-calendar and /holidays-and-breaks (checked Nov 24, 2026).
// UK marks these as projected and subject to change. Months are 1-12.
// Each semester runs from the first class day to the last final exam.
// Midterms week: UK publishes one "Midterm" date (the Monday of week 10, which lands on fall or
// spring break) and a two-week midterm grade window before it. We mark the week before that break.
// UK has published midterm dates through spring 2028; junior and senior years follow the same pattern.
const YEARS = [
  { name: "Freshman",  fall: [2026, 8, 24], fallEnd: [2026, 12, 17], spring: [2027, 1, 11], springEnd: [2027, 5, 6],
    midterms: { fall: [[2026, 10, 19], [2026, 10, 23]], spring: [[2027, 3, 8], [2027, 3, 12]] },
    reading:  { fall: [[2026, 12, 10], [2026, 12, 11]], spring: [[2027, 4, 29], [2027, 4, 30]] },
    finals:   { fall: [[2026, 12, 14], [2026, 12, 17]], spring: [[2027, 5, 3], [2027, 5, 6]] },
    breaks: [
      { name: "Labor Day", a: [2026, 9, 7], b: [2026, 9, 7] },
      { name: "Fall break", a: [2026, 10, 26], b: [2026, 10, 27] },
      { name: "Thanksgiving break", a: [2026, 11, 25], b: [2026, 11, 28] },
      { name: "MLK Day", a: [2027, 1, 18], b: [2027, 1, 18] },
      { name: "Spring break", a: [2027, 3, 15], b: [2027, 3, 20] },
    ] },
  { name: "Sophomore", fall: [2027, 8, 23], fallEnd: [2027, 12, 16], spring: [2028, 1, 10], springEnd: [2028, 5, 4],
    midterms: { fall: [[2027, 10, 18], [2027, 10, 22]], spring: [[2028, 3, 6], [2028, 3, 10]] },
    reading:  { fall: [[2027, 12, 9], [2027, 12, 10]], spring: [[2028, 4, 27], [2028, 4, 28]] },
    finals:   { fall: [[2027, 12, 13], [2027, 12, 16]], spring: [[2028, 5, 1], [2028, 5, 4]] },
    breaks: [
      { name: "Labor Day", a: [2027, 9, 6], b: [2027, 9, 6] },
      { name: "Fall break", a: [2027, 11, 22], b: [2027, 11, 23] },
      { name: "Thanksgiving break", a: [2027, 11, 24], b: [2027, 11, 27] },
      { name: "MLK Day", a: [2028, 1, 17], b: [2028, 1, 17] },
      { name: "Spring break", a: [2028, 3, 13], b: [2028, 3, 18] },
    ] },
  { name: "Junior",    fall: [2028, 8, 21], fallEnd: [2028, 12, 14], spring: [2029, 1, 8],  springEnd: [2029, 5, 3],
    midterms: { fall: [[2028, 10, 16], [2028, 10, 20]], spring: [[2029, 3, 5], [2029, 3, 9]] },
    reading:  { fall: [[2028, 12, 7], [2028, 12, 8]], spring: [[2029, 4, 26], [2029, 4, 27]] },
    finals:   { fall: [[2028, 12, 11], [2028, 12, 14]], spring: [[2029, 4, 30], [2029, 5, 3]] },
    breaks: [
      { name: "Labor Day", a: [2028, 9, 4], b: [2028, 9, 4] },
      { name: "Election Day", a: [2028, 11, 7], b: [2028, 11, 7] },
      { name: "Fall break", a: [2028, 11, 20], b: [2028, 11, 21] },
      { name: "Thanksgiving break", a: [2028, 11, 22], b: [2028, 11, 25] },
      { name: "MLK Day", a: [2029, 1, 15], b: [2029, 1, 15] },
      { name: "Spring break", a: [2029, 3, 12], b: [2029, 3, 17] },
    ] },
  { name: "Senior",    fall: [2029, 8, 20], fallEnd: [2029, 12, 13], spring: [2030, 1, 7],  springEnd: [2030, 5, 2],
    midterms: { fall: [[2029, 10, 15], [2029, 10, 19]], spring: [[2030, 3, 4], [2030, 3, 8]] },
    reading:  { fall: [[2029, 12, 6], [2029, 12, 7]], spring: [[2030, 4, 25], [2030, 4, 26]] },
    finals:   { fall: [[2029, 12, 10], [2029, 12, 13]], spring: [[2030, 4, 29], [2030, 5, 2]] },
    breaks: [
      { name: "Labor Day", a: [2029, 9, 3], b: [2029, 9, 3] },
      { name: "Fall break", a: [2029, 11, 19], b: [2029, 11, 20] },
      { name: "Thanksgiving break", a: [2029, 11, 21], b: [2029, 11, 24] },
      { name: "MLK Day", a: [2030, 1, 21], b: [2030, 1, 21] },
      { name: "Spring break", a: [2030, 3, 11], b: [2030, 3, 16] },
    ] },
];
const GRADUATION = [[2030, 5, 3], [2030, 5, 4]]; // UK spring 2030 commencement
// UK holidays outside the semesters (offices closed, no classes). UK sets its own observed dates.
const HOLIDAYS = [
  { name: "Independence Day", a: [2026, 7, 3] },
  { name: "Christmas Day", a: [2026, 12, 25] },
  { name: "New Year's Day", a: [2027, 1, 1] },
  { name: "Memorial Day", a: [2027, 5, 31] },
  { name: "Juneteenth", a: [2027, 6, 18] },
  { name: "Independence Day", a: [2027, 7, 5] },
  { name: "Christmas Day", a: [2027, 12, 24] },
  { name: "New Year's Day", a: [2027, 12, 31] },
  { name: "Memorial Day", a: [2028, 5, 29] },
  { name: "Juneteenth", a: [2028, 6, 19] },
  { name: "Independence Day", a: [2028, 7, 4] },
  { name: "Christmas Day", a: [2028, 12, 28] },
  { name: "New Year's Day", a: [2029, 1, 1] },
  { name: "Memorial Day", a: [2029, 5, 28] },
  { name: "Juneteenth", a: [2029, 6, 19] },
  { name: "Independence Day", a: [2029, 7, 4] },
  { name: "Christmas Day", a: [2029, 12, 25] },
  { name: "New Year's Day", a: [2030, 1, 1] },
  { name: "Memorial Day", a: [2030, 5, 27] },
  { name: "Juneteenth", a: [2030, 6, 19] },
];

const d = ([y, m, day]) => new Date(y, m - 1, day);
const DAY = 86400000;
const fmt = (dt) => dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const short = (dt) => dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const dayOf = (dt) => dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const $ = (id) => document.getElementById(id);

const now = new Date(); now.setHours(0, 0, 0, 0);
const grad = d(GRADUATION[0]), gradEnd = d(GRADUATION[1]);
const span = (a, b) => (a.getTime() === b.getTime() ? short(a) : `${short(a)} – ${short(b)}`);
// First weekday after a date, for "classes resume".
const resumeAfter = (dt) => { const r = new Date(dt.getTime() + DAY); while (r.getDay() === 0 || r.getDay() === 6) r.setDate(r.getDate() + 1); return r; };

const termOf = (y, label, a, b, mid, rd, fin) => {
  const breaks = y.breaks.map((k) => ({ name: k.name, kind: "brk", a: d(k.a), b: d(k.b) })).filter((k) => k.a >= d(a) && k.b <= d(b));
  const midterms = { name: "Midterms week", kind: "mid", a: d(mid[0]), b: d(mid[1]) };
  const reading = { name: "Reading days", kind: "read", a: d(rd[0]), b: d(rd[1]) };
  const finals = { name: "Finals week", kind: "fin", a: d(fin[0]), b: d(fin[1]) };
  // Everything that happens inside the semester, in date order.
  const events = [...breaks, midterms, reading, finals].sort((p, q) => p.a - q.a);
  return { year: y.name, label, a: d(a), b: d(b), breaks, midterms, reading, finals, events };
};
const terms = YEARS.flatMap((y) => [
  termOf(y, "Fall", y.fall, y.fallEnd, y.midterms.fall, y.reading.fall, y.finals.fall),
  termOf(y, "Spring", y.spring, y.springEnd, y.midterms.spring, y.reading.spring, y.finals.spring),
]);

const cur = terms.findIndex((t) => now >= t.a && now <= t.b);
const next = terms.findIndex((t) => t.a > now);

if (now >= grad) {
  $("year").textContent = now > gradEnd ? "Graduated" : "Graduation";
  $("where").textContent = `Commencement ${span(grad, gradEnd)}, ${grad.getFullYear()}.`;
} else if (cur >= 0) {
  const t = terms[cur];
  $("year").textContent = `${t.year} year`;
  const on = t.events.find((k) => now >= k.a && now <= k.b);
  const upcoming = t.events.find((k) => k.a > now);
  let ahead;
  if (on && on.kind === "brk") ahead = `${on.name}. Classes resume ${dayOf(resumeAfter(on.b))}.`;
  else if (on && on.kind === "mid") ahead = `Midterms week, through ${dayOf(on.b)}.`;
  else if (on && on.kind === "read") ahead = `Reading days, no classes. Finals start ${dayOf(t.finals.a)}.`;
  else if (on && on.kind === "fin") ahead = `Finals week. Semester ends ${dayOf(t.b)}.`;
  else if (upcoming) ahead = `${upcoming.name} starts ${dayOf(upcoming.a)}.`;
  else ahead = `Semester ends ${dayOf(t.b)}.`;
  $("where").textContent = `${t.label} semester ${t.a.getFullYear()}. ${ahead}`;
} else {
  const prev = next > 0 ? terms[next - 1] : null;
  $("year").textContent = next >= 0 ? (terms[next].label === "Fall" && prev ? `Summer before ${terms[next].year.toLowerCase()} year` : "Break") : "Final stretch";
  $("where").textContent = next >= 0 ? `Between semesters. Next up: ${terms[next].year} ${terms[next].label}.` : "";
}

const tl = $("timeline");
YEARS.forEach((y, i) => {
  const col = document.createElement("div");
  col.className = "ycol";
  tl.appendChild(col);
  const h = document.createElement("p");
  h.className = "yr";
  h.textContent = `${y.name} year`;
  col.appendChild(h);
  [0, 1].forEach((k) => {
    const idx = i * 2 + k, t = terms[idx];
    const el = document.createElement("div");
    el.className = "sem" + (idx === cur ? " now" : now > t.b ? " done" : "");
    el.innerHTML = `<b>${idx === cur ? '<span class="tag">Now</span>' : ""}${t.label} ${t.a.getFullYear()}</b><small>${short(t.a)} – ${short(t.b)}</small>` +
      t.events.map((k) => `<small class="${k.kind}">${k.name}: ${span(k.a, k.b)}</small>`).join("");
    col.appendChild(el);
  });
});

// Year calendar: each college year runs July 1 through June 30.
const yearStart = (i) => new Date(d(YEARS[i].fall).getFullYear(), 6, 1);
const yearOfDate = (dt) => {
  for (let i = YEARS.length - 1; i >= 0; i--) if (dt >= yearStart(i)) return i;
  return 0;
};
const holidays = HOLIDAYS.map((h) => ({ name: h.name, kind: "brk", a: d(h.a), b: d(h.a) }));
const allBreaks = [...terms.flatMap((t) => t.breaks), ...holidays];
// Hover text: the date plus whatever is happening that day.
const labelOf = (dt) => {
  if (dt >= grad && dt <= gradEnd) return "Commencement";
  const k = [...terms.flatMap((t) => t.events), ...holidays].find((e) => dt >= e.a && dt <= e.b);
  return k ? k.name : "";
};
const dayClass = (dt) => {
  const c = ["d"];
  if (dt.getTime() === now.getTime()) c.push("today");
  else if (dt >= grad && dt <= gradEnd) c.push("grad");
  else if (terms.some((t) => dt >= t.finals.a && dt <= t.finals.b)) c.push("fin");
  else if (terms.some((t) => dt >= t.midterms.a && dt <= t.midterms.b)) c.push("mid");
  else if (allBreaks.some((k) => dt >= k.a && dt <= k.b)) c.push("brk");
  else if (terms.some((t) => dt >= t.reading.a && dt <= t.reading.b)) c.push("read");
  else if (terms.some((t) => dt >= t.a && dt <= t.b)) c.push("term");
  if (dt < now) c.push("past");
  return c.join(" ");
};
const monthName = (dt) => dt.toLocaleDateString("en-US", { month: "long" });

function drawYear(i) {
  const first = yearStart(i);
  const last = new Date(first.getFullYear() + 1, 5, 30);
  $("range").textContent = `${YEARS[i].name} year: ${fmt(first)} to ${fmt(last)}`;
  [...$("tabs").children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  const wrap = $("months");
  wrap.innerHTML = "";
  for (let m = 0; m < 12; m++) {
    const mStart = new Date(first.getFullYear(), first.getMonth() + m, 1);
    const days = new Date(mStart.getFullYear(), mStart.getMonth() + 1, 0).getDate();
    let html = `<h3>${monthName(mStart)} <span>${mStart.getFullYear()}</span></h3><div class="days">`;
    html += ["S", "M", "T", "W", "T", "F", "S"].map((w) => `<span class="dow">${w}</span>`).join("");
    html += "<span></span>".repeat(mStart.getDay());
    for (let n = 1; n <= days; n++) {
      const dt = new Date(mStart.getFullYear(), mStart.getMonth(), n);
      const lbl = labelOf(dt);
      html += `<span class="${dayClass(dt)}" title="${dayOf(dt)}${lbl ? ": " + lbl : ""}">${n}</span>`;
    }
    const el = document.createElement("div");
    el.className = "month";
    el.innerHTML = html + "</div>";
    wrap.appendChild(el);
  }
}

YEARS.forEach((y, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = y.name;
  b.addEventListener("click", () => drawYear(i));
  $("tabs").appendChild(b);
});
drawYear(Math.min(yearOfDate(now), YEARS.length - 1));
</script>
</body>
</html>
