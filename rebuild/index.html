<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Rebuild | Jared Luyster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23131113'/%3E%3Cpath fill='%23f2971d' d='M1 6h6v1H1zM2 3h4v2H2zM3 1h2v2H3z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/shared-theme.css" />
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  .kicker { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
  h2 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 1rem; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .sem { border: 2px solid var(--muted); padding: 10px 12px; color: var(--muted); }
  .sem b { display: block; font-family: var(--font-display); color: var(--text); }
  .sem.done { border-color: var(--paper); color: var(--paper); opacity: .6; }
  .sem.now { border-color: var(--accent); background: var(--surface); color: var(--text); box-shadow: var(--shadow-soft); }
  .sem .tag { float: right; margin-left: 8px; padding: 1px 6px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
  .sem small { display: block; margin-top: 2px; }
  .yr { margin: 18px 0 6px; font-family: var(--font-display); color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; grid-column: 1 / -1; }
  .yr:first-child { margin-top: 0; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

  section + section { margin-top: 40px; }
  .cal-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { font: inherit; font-family: var(--font-display); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; padding: 5px 10px; background: none; color: var(--muted); border: 2px solid var(--muted); cursor: pointer; }
  .tabs button:hover { color: var(--text); border-color: var(--paper); }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .range { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px 16px; }
  .month h3 { font-family: var(--font-display); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
  .month h3 span { color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: .78rem; text-align: center; }
  .days .dow { color: var(--muted); font-size: .65rem; padding-bottom: 2px; }
  .days .d { padding: 4px 0; color: var(--muted); border: 1px solid transparent; }
  .days .d.term { background: var(--surface); color: var(--text); }
  .days .d.brk { background: none; color: var(--accent); border-color: var(--accent); }
  .days .d.grad { background: var(--paper); color: var(--ink); font-weight: 700; }
  .days .d.today { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .days .d.past { opacity: .45; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; color: var(--muted); font-size: .8rem; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1px solid transparent; }
  .legend .term { background: var(--surface); border-color: var(--muted); }
  .legend .brk { border-color: var(--accent); }
  .legend .grad { background: var(--paper); }
  .legend .today { background: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="kicker">Rebuild</p>
  <h1 id="year">…</h1>
  <p class="sub" id="where"></p>

  <section aria-label="Year calendar">
    <div class="cal-head">
      <h2>Calendar</h2>
      <div class="tabs" id="tabs" role="group" aria-label="College year"></div>
    </div>
    <p class="range" id="range"></p>
    <div class="months" id="months"></div>
    <div class="legend">
      <span><i class="term"></i>Semester</span>
      <span><i class="brk"></i>Break</span>
      <span><i class="grad"></i>Graduation</span>
      <span><i class="today"></i>Today</span>
    </div>
  </section>

  <section aria-label="Timeline">
    <h2>Timeline</h2>
    <div class="grid" id="timeline"></div>
  </section>
</main>

<script>
// The college-year framework: these are Jared's own term dates, not a real school's.
// Edit them here. Months are 1-12.
const YEARS = [
  { name: "Freshman",  fall: [2026, 8, 24], fallEnd: [2026, 12, 18], spring: [2027, 1, 11], springEnd: [2027, 5, 7],
    breaks: [{ name: "Thanksgiving break", a: [2026, 11, 25], b: [2026, 11, 29] }, { name: "Spring break", a: [2027, 3, 8], b: [2027, 3, 14] }] },
  { name: "Sophomore", fall: [2027, 8, 23], fallEnd: [2027, 12, 17], spring: [2028, 1, 10], springEnd: [2028, 5, 5],
    breaks: [{ name: "Thanksgiving break", a: [2027, 11, 24], b: [2027, 11, 28] }, { name: "Spring break", a: [2028, 3, 6], b: [2028, 3, 12] }] },
  { name: "Junior",    fall: [2028, 8, 21], fallEnd: [2028, 12, 15], spring: [2029, 1, 8],  springEnd: [2029, 5, 4],
    breaks: [{ name: "Thanksgiving break", a: [2028, 11, 22], b: [2028, 11, 26] }, { name: "Spring break", a: [2029, 3, 5], b: [2029, 3, 11] }] },
  { name: "Senior",    fall: [2029, 8, 20], fallEnd: [2029, 12, 14], spring: [2030, 1, 7],  springEnd: [2030, 5, 3],
    breaks: [{ name: "Thanksgiving break", a: [2029, 11, 21], b: [2029, 11, 25] }, { name: "Spring break", a: [2030, 3, 4], b: [2030, 3, 10] }] },
];
const GRADUATION = [2030, 5, 11];

const d = ([y, m, day]) => new Date(y, m - 1, day);
const DAY = 86400000;
const fmt = (dt) => dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const short = (dt) => dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const dayOf = (dt) => dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const $ = (id) => document.getElementById(id);

const now = new Date(); now.setHours(0, 0, 0, 0);
const start = d(YEARS[0].fall), grad = d(GRADUATION);

const termOf = (y, label, a, b) => ({
  year: y.name, label, a: d(a), b: d(b),
  breaks: y.breaks.map((k) => ({ name: k.name, a: d(k.a), b: d(k.b) })).filter((k) => k.a >= d(a) && k.b <= d(b)),
});
const terms = YEARS.flatMap((y) => [
  termOf(y, "Fall", y.fall, y.fallEnd),
  termOf(y, "Spring", y.spring, y.springEnd),
]);

const cur = terms.findIndex((t) => now >= t.a && now <= t.b);
const next = terms.findIndex((t) => t.a > now);

if (now > grad) {
  $("year").textContent = "Graduated";
  $("where").textContent = fmt(grad);
} else if (cur >= 0) {
  const t = terms[cur];
  $("year").textContent = `${t.year} year`;
  const onBreak = t.breaks.find((k) => now >= k.a && now <= k.b);
  const nextBreak = t.breaks.find((k) => k.a > now);
  let ahead;
  if (onBreak) ahead = `${onBreak.name}. Classes resume ${dayOf(new Date(onBreak.b.getTime() + DAY))}.`;
  else if (nextBreak) ahead = `${nextBreak.name} starts ${dayOf(nextBreak.a)}.`;
  else ahead = `Semester ends ${dayOf(t.b)}.`;
  $("where").textContent = `${t.label} semester ${t.a.getFullYear()}. ${ahead}`;
} else {
  const prev = next > 0 ? terms[next - 1] : null;
  $("year").textContent = next >= 0 ? (terms[next].label === "Fall" && prev ? `Summer before ${terms[next].year.toLowerCase()} year` : "Break") : "Final stretch";
  $("where").textContent = next >= 0 ? `Between semesters. Next up: ${terms[next].year} ${terms[next].label}.` : "";
}

const tl = $("timeline");
YEARS.forEach((y, i) => {
  const h = document.createElement("p");
  h.className = "yr";
  h.textContent = `${y.name} year`;
  tl.appendChild(h);
  [0, 1].forEach((k) => {
    const idx = i * 2 + k, t = terms[idx];
    const el = document.createElement("div");
    el.className = "sem" + (idx === cur ? " now" : now > t.b ? " done" : "");
    el.innerHTML = `<b>${idx === cur ? '<span class="tag">Now</span>' : ""}${t.label} ${t.a.getFullYear()}</b><small>${short(t.a)} – ${short(t.b)}</small>` +
      t.breaks.map((k) => `<small>${k.name}: ${short(k.a)} – ${short(k.b)}</small>`).join("");
    tl.appendChild(el);
  });
});

// Year calendar: each college year runs August 1 through July 31.
const yearStart = (i) => new Date(d(YEARS[i].fall).getFullYear(), 7, 1);
const yearOfDate = (dt) => {
  for (let i = YEARS.length - 1; i >= 0; i--) if (dt >= yearStart(i)) return i;
  return 0;
};
const allBreaks = terms.flatMap((t) => t.breaks);
const dayClass = (dt) => {
  const c = ["d"];
  if (dt.getTime() === now.getTime()) c.push("today");
  else if (dt.getTime() === grad.getTime()) c.push("grad");
  else if (allBreaks.some((k) => dt >= k.a && dt <= k.b)) c.push("brk");
  else if (terms.some((t) => dt >= t.a && dt <= t.b)) c.push("term");
  if (dt < now) c.push("past");
  return c.join(" ");
};
const monthName = (dt) => dt.toLocaleDateString("en-US", { month: "long" });

function drawYear(i) {
  const first = yearStart(i);
  const last = new Date(first.getFullYear() + 1, 6, 31);
  $("range").textContent = `${YEARS[i].name} year: ${fmt(first)} to ${fmt(last)}`;
  [...$("tabs").children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  const wrap = $("months");
  wrap.innerHTML = "";
  for (let m = 0; m < 12; m++) {
    const mStart = new Date(first.getFullYear(), first.getMonth() + m, 1);
    const days = new Date(mStart.getFullYear(), mStart.getMonth() + 1, 0).getDate();
    let html = `<h3>${monthName(mStart)} <span>${mStart.getFullYear()}</span></h3><div class="days">`;
    html += ["S", "M", "T", "W", "T", "F", "S"].map((w) => `<span class="dow">${w}</span>`).join("");
    html += "<span></span>".repeat(mStart.getDay());
    for (let n = 1; n <= days; n++) {
      const dt = new Date(mStart.getFullYear(), mStart.getMonth(), n);
      html += `<span class="${dayClass(dt)}" title="${dayOf(dt)}">${n}</span>`;
    }
    const el = document.createElement("div");
    el.className = "month";
    el.innerHTML = html + "</div>";
    wrap.appendChild(el);
  }
}

YEARS.forEach((y, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = y.name;
  b.addEventListener("click", () => drawYear(i));
  $("tabs").appendChild(b);
});
drawYear(Math.min(yearOfDate(now), YEARS.length - 1));
</script>
</body>
</html>
